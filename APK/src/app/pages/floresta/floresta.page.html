<ion-content [fullscreen]="true" [scrollY]="false">
  <!-- As sobras do palco recebem a cor solida do tema ativo
       (ESPECIFICATION 5, BACKLOG 4.1). -->
  <div class="moldura" [style.background]="fundo.corDaBorda()">
    <div class="palco" [style.background-image]="'url(' + fundo.imagem() + ')'">
      @if (settings.nome(); as nome) {
        <div class="cracha">{{ 'inicio.ola' | translate: { nome } }}</div>
      }

      @for (animal of lista; track animal.chave) {
        <button
          type="button"
          class="animal"
          [class]="'idle-' + animal.chave"
          [style.left.%]="animal.x"
          [style.top.%]="animal.y"
          [style.width.%]="animal.largura"
          [style.z-index]="camada(animal)"
          [attr.aria-label]="'animais.' + animal.chave | translate"
        >
          <img [src]="imagem(animal)" [alt]="'animais.' + animal.chave | translate" />
        </button>
      }
    </div>
  </div>
</ion-content>
